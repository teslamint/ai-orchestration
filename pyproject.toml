[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "ai-orchestration"
version = "0.5.0a0"
description = "6-stage AI orchestration tool: proxy-first multi-model routing with CLI fallback"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "pydantic>=2.12.5",
    "rich>=14.2.0",
    "typer>=0.21.1",
    "openai>=1.82.0",
]

[project.scripts]
ai-orchestration = "ai_orchestration.cli:app"

[project.optional-dependencies]
api = [
    "anthropic>=0.52.0",
    "google-generativeai>=0.8.0",
]

[dependency-groups]
dev = [
    "pre-commit>=4.2.0",
    "pytest>=8.4.2",
    "ruff>=0.9.3",
]

[tool.setuptools.packages.find]
where = ["src"]

[tool.ruff]
line-length = 88
target-version = "py310"
exclude = ["workspace", ".venv"]

[tool.ruff.lint]
select = ["E", "F", "I"]
ignore = ["E501", "E722"]

[tool.ruff.lint.per-file-ignores]
"tests/*" = ["E402"]

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = ["test_*.py"]
norecursedirs = ["workspace", "logs", "orchestrator_debug_logs", ".venv"]
