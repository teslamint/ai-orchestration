name: Orchestration Tests

on:
  push:
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v5

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version-file: .python-version

      - name: Install dependencies
        run: uv sync --dev

      - name: Lint with ruff
        run: uv run ruff check .

      - name: Check formatting
        run: uv run ruff format --check .

      - name: Check out pinned compound-loop contract source
        run: |
          commit=$(python3 -c 'import json; print(json.load(open("tests/fixtures/compound_loop/manifest.json"))["source_commit"])')
          git clone --filter=blob:none --no-checkout https://github.com/teslamint/compound-loop.git "$RUNNER_TEMP/compound-loop"
          git -C "$RUNNER_TEMP/compound-loop" checkout --detach "$commit"
          echo "COMPOUND_LOOP_SOURCE=$RUNNER_TEMP/compound-loop" >> "$GITHUB_ENV"

      - name: Run tests
        run: uv run pytest -v

  live-lock:
    strategy:
      matrix:
        os: [ubuntu-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v5

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version-file: .python-version

      - name: Install dependencies
        run: uv sync --dev

      - name: Run live lock tests
        run: uv run pytest -v tests/integration/test_live_run_lock.py
